<svg width="1200" height="600" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#11998e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38ef7d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mug" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8f9fa;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="600" fill="url(#bg2)"/>
  
  <!-- Left side - Products showcase -->
  <g transform="translate(150, 150)">
    <!-- Mug -->
    <ellipse cx="100" cy="140" rx="50" ry="15" fill="#2c3e50" opacity="0.3"/>
    <rect x="60" y="80" width="80" height="60" rx="5" fill="url(#mug)"/>
    <rect x="140" y="95" width="15" height="30" rx="7" fill="#2c3e50" opacity="0.8"/>
    
    <!-- T-shirt -->
    <g transform="translate(200, 0)">
      <rect x="40" y="60" width="80" height="80" rx="15" fill="#ffffff" opacity="0.9"/>
      <rect x="30" y="70" width="20" height="40" rx="10" fill="#ffffff" opacity="0.9"/>
      <rect x="110" y="70" width="20" height="40" rx="10" fill="#ffffff" opacity="0.9"/>
      <circle cx="80" cy="90" r="15" fill="#e74c3c" opacity="0.7"/>
    </g>
    
    <!-- Poster -->
    <g transform="translate(0, 200)">
      <rect x="0" y="0" width="120" height="80" rx="5" fill="#2c3e50"/>
      <rect x="10" y="10" width="100" height="60" fill="#ffffff"/>
      <rect x="20" y="20" width="80" height="15" fill="#3498db" opacity="0.6"/>
      <rect x="20" y="40" width="60" height="10" fill="#e74c3c" opacity="0.6"/>
    </g>
  </g>
  
  <!-- Right side - Person with products -->
  <g transform="translate(650, 100)">
    <!-- Person -->
    <ellipse cx="150" cy="80" rx="45" ry="55" fill="#ffffff" opacity="0.95"/>
    <rect x="105" y="135" width="90" height="130" rx="12" fill="#ffffff" opacity="0.95"/>
    <rect x="85" y="155" width="35" height="90" rx="17" fill="#ffffff" opacity="0.95"/>
    <rect x="180" y="155" width="35" height="90" rx="17" fill="#ffffff" opacity="0.95"/>
    <rect x="120" y="265" width="25" height="110" rx="12" fill="#ffffff" opacity="0.95"/>
    <rect x="165" y="265" width="25" height="110" rx="12" fill="#ffffff" opacity="0.95"/>
    
    <!-- Person holding mug -->
    <ellipse cx="200" cy="180" rx="15" ry="10" fill="#2c3e50" opacity="0.7"/>
    <rect x="190" y="170" width="20" height="15" rx="2" fill="#ffffff"/>
  </g>
  
  <!-- Text overlay -->
  <text x="600" y="420" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="48" font-weight="bold">
    Loja Completa PicTuz
  </text>
  <text x="600" y="460" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" opacity="0.9">
    Canecas, T-shirts, Posters e muito mais
  </text>
  
  <!-- Floating elements -->
  <circle cx="1000" cy="100" r="25" fill="#ffffff" opacity="0.1"/>
  <polygon points="950,200 980,180 980,220" fill="#ffffff" opacity="0.15"/>
  <rect x="1020" y="250" width="40" height="40" rx="5" fill="#ffffff" opacity="0.1"/>
</svg> 