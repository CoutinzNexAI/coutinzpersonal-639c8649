<svg width="1200" height="600" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffa726;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e53e3e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c53030;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="600" fill="url(#bg3)"/>
  
  <!-- Discount badge -->
  <g transform="translate(100, 80)">
    <circle cx="0" cy="0" r="80" fill="url(#badge)"/>
    <text x="0" y="-10" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="36" font-weight="bold">30%</text>
    <text x="0" y="20" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="18">OFF</text>
  </g>
  
  <!-- Product stack -->
  <g transform="translate(300, 120)">
    <!-- Stack shadow -->
    <ellipse cx="150" cy="300" rx="100" ry="30" fill="#000000" opacity="0.2"/>
    
    <!-- Canvas (back) -->
    <rect x="80" y="150" width="140" height="100" rx="8" fill="#2c3e50" transform="rotate(-5)"/>
    <rect x="90" y="160" width="120" height="80" fill="#ffffff" transform="rotate(-5)"/>
    
    <!-- Mug (middle) -->
    <g transform="translate(50, 200)">
      <rect x="40" y="20" width="60" height="50" rx="5" fill="#ffffff"/>
      <rect x="100" y="35" width="12" height="20" rx="6" fill="#2c3e50"/>
      <circle cx="70" cy="45" r="15" fill="#ffa726" opacity="0.8"/>
    </g>
    
    <!-- T-shirt (front) -->
    <g transform="translate(120, 180)">
      <rect x="30" y="40" width="70" height="70" rx="12" fill="#ffffff"/>
      <rect x="20" y="50" width="18" height="35" rx="9" fill="#ffffff"/>
      <rect x="102" y="50" width="18" height="35" rx="9" fill="#ffffff"/>
      <rect x="45" y="60" width="40" height="20" rx="5" fill="#ff6b6b" opacity="0.8"/>
    </g>
  </g>
  
  <!-- Right side - Happy person -->
  <g transform="translate(700, 120)">
    <!-- Person with arms up (celebration) -->
    <ellipse cx="150" cy="80" rx="45" ry="55" fill="#ffffff"/>
    <rect x="105" y="135" width="90" height="130" rx="12" fill="#ffffff"/>
    <!-- Arms up -->
    <rect x="70" y="140" width="35" height="60" rx="17" fill="#ffffff" transform="rotate(-30)"/>
    <rect x="195" y="140" width="35" height="60" rx="17" fill="#ffffff" transform="rotate(30)"/>
    <rect x="120" y="265" width="25" height="110" rx="12" fill="#ffffff"/>
    <rect x="165" y="265" width="25" height="110" rx="12" fill="#ffffff"/>
    
    <!-- Smile -->
    <path d="M 130 90 Q 150 110 170 90" stroke="#2c3e50" stroke-width="3" fill="none"/>
    <circle cx="140" cy="75" r="3" fill="#2c3e50"/>
    <circle cx="160" cy="75" r="3" fill="#2c3e50"/>
  </g>
  
  <!-- Main text -->
  <text x="600" y="380" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="52" font-weight="bold">
    MEGA PROMOÇÃO!
  </text>
  <text x="600" y="420" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" opacity="0.95">
    30% de desconto em todos os produtos
  </text>
  <text x="600" y="460" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" opacity="0.9">
    Por tempo limitado • Use código: PICTUZ30
  </text>
  
  <!-- Decorative stars -->
  <g fill="#ffffff" opacity="0.3">
    <polygon points="1000,150 1007,170 1027,170 1011,183 1018,203 1000,190 982,203 989,183 973,170 993,170" />
    <polygon points="950,250 955,265 970,265 958,275 963,290 950,282 937,290 942,275 930,265 945,265" />
    <polygon points="1050,300 1055,315 1070,315 1058,325 1063,340 1050,332 1037,340 1042,325 1030,315 1045,315" />
  </g>
</svg> 